<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110" shape-rendering="crispEdges">
  <!-- Outer Glow / Soft Shadow -->
  <rect x="25" y="98" width="60" height="6" rx="3" fill="rgba(0, 0, 0, 0.25)" shape-rendering="auto" />

  <!-- Robot / Space Pet Body (Retro Pixel-Art Aesthetic) -->
  <!-- Outer outline -->
  <rect x="25" y="20" width="60" height="65" fill="#1e1e2e" rx="14" shape-rendering="auto" />
  
  <!-- Main Head / Body Screen -->
  <rect x="28" y="23" width="54" height="59" fill="#2b2d42" rx="11" shape-rendering="auto" />
  <rect x="33" y="28" width="44" height="42" fill="#181825" rx="7" shape-rendering="auto" />

  <!-- Antennas with Neon Orb -->
  <rect x="52" y="8" width="6" height="13" fill="#89b4fa" />
  <circle cx="55" cy="8" r="6" fill="#f5c2e7" shape-rendering="auto" />
  <circle cx="55" cy="8" r="3" fill="#ffffff" shape-rendering="auto" />

  <!-- Cute Pixel Visor Eyes -->
  <rect x="40" y="38" width="10" height="12" fill="#a6e3a1" rx="2" shape-rendering="auto" />
  <rect x="60" y="38" width="10" height="12" fill="#a6e3a1" rx="2" shape-rendering="auto" />
  <!-- Eye Highlights -->
  <rect x="42" y="40" width="4" height="4" fill="#ffffff" />
  <rect x="62" y="40" width="4" height="4" fill="#ffffff" />

  <!-- Blush Pixels -->
  <rect x="36" y="54" width="7" height="3" fill="#f38ba8" rx="1" shape-rendering="auto" />
  <rect x="67" y="54" width="7" height="3" fill="#f38ba8" rx="1" shape-rendering="auto" />

  <!-- Friendly Smile -->
  <rect x="50" y="56" width="10" height="3" fill="#cdd6f4" rx="1" shape-rendering="auto" />
  <rect x="48" y="54" width="3" height="3" fill="#cdd6f4" />
  <rect x="59" y="54" width="3" height="3" fill="#cdd6f4" />

  <!-- Body Details / Badges -->
  <rect x="47" y="74" width="16" height="4" fill="#89b4fa" rx="2" shape-rendering="auto" />

  <!-- Cute Little Floating Limbs / Paws -->
  <rect x="18" y="44" width="8" height="16" fill="#89b4fa" rx="4" shape-rendering="auto" />
  <rect x="84" y="44" width="8" height="16" fill="#89b4fa" rx="4" shape-rendering="auto" />

  <rect x="36" y="84" width="12" height="7" fill="#89b4fa" rx="3" shape-rendering="auto" />
  <rect x="62" y="84" width="12" height="7" fill="#89b4fa" rx="3" shape-rendering="auto" />
</svg>
